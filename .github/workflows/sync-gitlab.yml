name: Sync MelKit to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melkit-gitlab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether the GitLab secret is configured
        id: gitlab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitLab synchronization is pending. Add the GITLAB_TOKEN repository secret, then run this workflow again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout main with full history
        if: steps.gitlab.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Push main to GitLab without building Android
        if: steps.gitlab.outputs.ready == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY_URL: ${{ vars.GITLAB_REPOSITORY_URL }}
        run: bash ci/sync-gitlab.sh
